[project]
name = "weaveconnect"
version = "0.1.0"
description = "Connect a coding agent to Weave, prove each step worked, and show what to do next."
requires-python = ">=3.12"
dependencies = [
  "weave",
  "openai",
  "python-dotenv",
]

[project.scripts]
weaveconnect = "weaveconnect.cli:main"

[dependency-groups]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/weaveconnect"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
